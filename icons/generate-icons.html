<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Generate Extension Icons</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f0f0ee; display: flex; flex-direction: column; align-items: center; padding: 40px; gap: 24px; }
  h2 { margin: 0; font-size: 18px; }
  p { margin: 0; color: #666; font-size: 14px; }
  .previews { display: flex; gap: 20px; align-items: flex-end; }
  .preview { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #888; }
  button { padding: 10px 24px; font-size: 14px; font-weight: 600; background: #1a1a18; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  button:hover { background: #333; }
</style>
</head>
<body>
<h2>DealNews Blog Card Editor — Icon Generator</h2>
<p>Click the button to download all four icon sizes as PNGs.</p>

<div class="previews" id="previews"></div>
<button onclick="downloadAll()">Download All Icons</button>

<script>
const SIZES = [16, 32, 48, 128];

function drawIcon(size) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  const r = size * 0.18; // corner radius

  // Background — dark charcoal
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, r);
  ctx.fillStyle = '#1a1a18';
  ctx.fill();

  // Green accent bar (top strip)
  const barH = size * 0.22;
  ctx.beginPath();
  ctx.roundRect(0, 0, size, barH, [r, r, 0, 0]);
  ctx.fillStyle = '#3aaa5c';
  ctx.fill();

  if (size >= 32) {
    // Card body — white rectangle
    const pad  = size * 0.14;
    const cTop = barH + size * 0.08;
    const cW   = size - pad * 2;
    const cH   = size * 0.28;
    const cr   = size * 0.06;
    ctx.beginPath();
    ctx.roundRect(pad, cTop, cW, cH, cr);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fill();

    // Second card row
    const r2Top = cTop + cH + size * 0.06;
    const r2H   = size * 0.10;
    ctx.beginPath();
    ctx.roundRect(pad, r2Top, cW * 0.7, r2H, cr);
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fill();

    // "D" letter
    ctx.font = `bold ${Math.round(size * 0.30)}px -apple-system, sans-serif`;
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('D', size / 2, cTop + cH / 2);
  } else {
    // 16px: just a white dot in the center of green strip + dark bottom
    ctx.beginPath();
    ctx.arc(size / 2, size / 2, size * 0.2, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }

  return canvas;
}

// Render previews
window.addEventListener('DOMContentLoaded', () => {
  const container = document.getElementById('previews');
  SIZES.forEach(size => {
    const canvas = drawIcon(size);
    const div = document.createElement('div');
    div.className = 'preview';
    div.appendChild(canvas);
    div.appendChild(document.createTextNode(`${size}×${size}`));
    container.appendChild(div);
  });
});

function downloadAll() {
  SIZES.forEach((size, i) => {
    setTimeout(() => {
      const canvas = drawIcon(size);
      const a = document.createElement('a');
      a.download = `icon${size}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    }, i * 200);
  });
}
</script>
</body>
</html>
